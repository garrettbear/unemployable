<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f6f8fc"/>

  <!-- top bar -->
  <rect width="1200" height="72" fill="#f6f8fc"/>
  <g transform="translate(44,18)">
    <rect x="0" y="0" width="46" height="30" rx="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 25 V8" stroke="#c5221f"/>
      <path d="M7 8 L23 21" stroke="#ea4335"/>
      <path d="M23 21 L39 8" stroke="#9aa0a6"/>
      <path d="M39 8 V25" stroke="#5f6368"/>
    </g>
  </g>
  <text x="102" y="40" font-size="30" fill="#5f6368">Gmail</text>
  <text x="192" y="40" font-size="14" font-style="italic" fill="#9aa0a6">no longer in service</text>

  <!-- inbox card -->
  <rect x="40" y="96" width="1120" height="500" rx="18" fill="#ffffff"/>

  <!-- rows -->
  <g>
    <!-- row template repeated with different colors -->
    <g transform="translate(40,116)">
      <circle cx="44" cy="26" r="16" fill="#4285F4"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">G</text>
      <text x="78" y="31" font-size="16" font-weight="700" fill="#202124">Google Recruiting</text>
      <rect x="300" y="16" width="80" height="20" rx="4" fill="#fce8e6"/><text x="340" y="31" font-size="12" font-weight="700" fill="#c5221f" text-anchor="middle">Rejected</text>
      <text x="396" y="31" font-size="16" font-weight="700" fill="#202124">We've decided to move forward with other candidates…</text>
      <text x="1090" y="31" font-size="13" fill="#202124" text-anchor="end" font-weight="700">9:41 AM</text>
    </g>
    <line x1="40" y1="172" x2="1160" y2="172" stroke="#f1f3f4"/>

    <g transform="translate(40,172)">
      <circle cx="44" cy="26" r="16" fill="#635BFF"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">S</text>
      <text x="78" y="31" font-size="16" font-weight="700" fill="#202124">Stripe Talent Acquisition</text>
      <rect x="370" y="16" width="92" height="20" rx="4" fill="#fce8e6"/><text x="416" y="31" font-size="12" font-weight="700" fill="#c5221f" text-anchor="middle">Rejected</text>
      <text x="478" y="31" font-size="16" font-weight="700" fill="#202124">Unfortunately we won't be moving forward…</text>
      <text x="1090" y="31" font-size="13" fill="#202124" text-anchor="end" font-weight="700">Yesterday</text>
    </g>
    <line x1="40" y1="228" x2="1160" y2="228" stroke="#f1f3f4"/>

    <g transform="translate(40,228)">
      <circle cx="44" cy="26" r="16" fill="#A259FF"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">F</text>
      <text x="78" y="31" font-size="16" font-weight="700" fill="#202124">Figma People Ops</text>
      <rect x="290" y="16" width="84" height="20" rx="4" fill="#fef7e0"/><text x="332" y="31" font-size="12" font-weight="700" fill="#b06000" text-anchor="middle">So close</text>
      <text x="390" y="31" font-size="16" font-weight="700" fill="#202124">It was a difficult decision, but…</text>
      <text x="1090" y="31" font-size="13" fill="#5f6368" text-anchor="end">May 28</text>
    </g>
    <line x1="40" y1="284" x2="1160" y2="284" stroke="#f1f3f4"/>

    <g transform="translate(40,284)" opacity="0.92">
      <circle cx="44" cy="26" r="16" fill="#FF4500"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">R</text>
      <text x="78" y="31" font-size="16" fill="#5f6368">Reddit Recruiting</text>
      <rect x="320" y="16" width="104" height="20" rx="4" fill="#e8eaed"/><text x="372" y="31" font-size="12" font-weight="700" fill="#5f6368" text-anchor="middle">Auto-reply</text>
      <text x="440" y="31" font-size="16" fill="#5f6368">Your application status: Not Selected…</text>
      <text x="1090" y="31" font-size="13" fill="#5f6368" text-anchor="end">May 21</text>
    </g>
    <line x1="40" y1="340" x2="1160" y2="340" stroke="#f1f3f4"/>

    <g transform="translate(40,340)" opacity="0.78">
      <circle cx="44" cy="26" r="16" fill="#0866FF"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">M</text>
      <text x="78" y="31" font-size="16" fill="#5f6368">Meta Candidate Experience</text>
      <text x="430" y="31" font-size="16" fill="#5f6368">We'll keep your resume on file…</text>
      <text x="1090" y="31" font-size="13" fill="#5f6368" text-anchor="end">May 12</text>
    </g>
    <line x1="40" y1="396" x2="1160" y2="396" stroke="#f1f3f4"/>

    <g transform="translate(40,396)" opacity="0.6">
      <circle cx="44" cy="26" r="16" fill="#1DB954"/><text x="44" y="32" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">S</text>
      <text x="78" y="31" font-size="16" fill="#5f6368">Spotify Talent</text>
      <text x="300" y="31" font-size="16" fill="#5f6368">After careful consideration…</text>
      <text x="1090" y="31" font-size="13" fill="#5f6368" text-anchor="end">May 3</text>
    </g>
    <line x1="40" y1="452" x2="1160" y2="452" stroke="#f1f3f4"/>

    <g transform="translate(40,452)" opacity="0.4">
      <circle cx="44" cy="26" r="16" fill="#FF9900"/>
      <rect x="78" y="20" width="360" height="12" rx="6" fill="#e8eaed"/>
      <text x="1090" y="31" font-size="13" fill="#9aa0a6" text-anchor="end">Apr 24</text>
    </g>
    <line x1="40" y1="508" x2="1160" y2="508" stroke="#f1f3f4"/>
    <g transform="translate(40,508)" opacity="0.22">
      <circle cx="44" cy="26" r="16" fill="#E50914"/>
      <rect x="78" y="20" width="300" height="12" rx="6" fill="#e8eaed"/>
    </g>
  </g>

  <!-- fade to imply endlessness -->
  <rect x="40" y="455" width="1120" height="141" fill="url(#fade)" />

  <!-- title overlay -->
  <g transform="translate(600,545)" text-anchor="middle">
    <text y="0" font-size="58" font-weight="700" fill="#202124" letter-spacing="2">UNEMPLOYABLE</text>
    <text y="34" font-size="20" fill="#c5221f" font-weight="700" letter-spacing="3">AN ENDLESS INBOX OF REJECTION</text>
  </g>
</svg>
