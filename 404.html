<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — UNEMPLOYABLE™</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f6f8fc;--text:#202124;--soft:#5f6368;--accent:#c5221f}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .box{max-width:480px}
    .code{font-size:clamp(56px,16vw,110px);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
    h1{font-size:clamp(20px,4vw,26px);font-weight:800;margin:14px 0 8px}
    p{font-size:15px;color:var(--soft);line-height:1.6;margin-bottom:24px}
    .btn{display:inline-block;background:var(--text);color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:24px;font-size:14px;transition:background .15s}
    .btn:hover{background:var(--accent)}
    .sub{margin-top:14px}
    .sub a{color:var(--soft);font-size:13px;text-decoration:none}
    .sub a:hover{color:var(--text)}
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>This message has been moved to the void.</h1>
    <p>We searched the entire inbox and found nothing here — which, honestly, is also how your job search is going.</p>
    <a class="btn" href="https://theunemployable.xyz">← Back to the rejections</a>
    <p class="sub"><a href="https://shop.theunemployable.xyz">or shop the brand →</a></p>
  </div>
</body>
</html>
